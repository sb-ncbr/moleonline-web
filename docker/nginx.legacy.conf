# The read-only archive of the old MOLEonline (LEGACY.md), in Kubernetes: plain HTTP on port 8080, as the cluster's
# Gateway terminates TLS and redirects HTTP. Based on nginx.production.conf.

# needed for unpriviledged setup
pid        /tmp/nginx.pid;

error_log  /dev/stderr;

events {
    worker_connections  1024;
}

http {
    include  /etc/nginx/mime.types;

    # the visits, for kubectl logs
    access_log /dev/stdout;

    # the visitor's address, not the Gateway's: trust X-Forwarded-For from the cluster's own addresses
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080;

        # needed for unpriviledged setup
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp_path;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        # nginx sees only HTTP on port 8080: its own redirects (e.g. of a directory) keep the visitor's address
        absolute_redirect off;

        # search engines drop the archive, for every file (the pages also say so)
        add_header X-Robots-Tag "noindex" always;

        gzip on;
        gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;

        root /var/www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # the readiness probe, kept out of the access log
        location = /healthz {
            access_log off;
            return 200;
        }

        location ~* "/online/templates/pdf-report.html" {
            rewrite ^/online/(.*)$ /html/templates/pdf-report.html;
        }

        location ~* "/online/templates/pdf-report-params.html" {
            rewrite ^/online/(.*)$ /html/templates/pdf-report-params.html;
        }

        location ~* "/online/templates/pdf-report.css" {
            rewrite ^/online/(.*)$ /html/templates/pdf-report.css;
        }

        location ~* "/online/([A-Za-z0-9]+)/([A-Za-z0-9]*)" {
            rewrite ^/online/(.*)$ /html/detail.html;
        }

        location ~* "/online/([A-Za-z0-9]+)" {
            rewrite ^/online/(.*)$ /html/detail.html;
        }

        location ~ ^/online/[A-Za-z0-9]+/[A-Za-z0-9]+$ {
            rewrite ^/online/[A-Za-z0-9]+/[A-Za-z0-9]+$ /html/detail.html;
        }
    }
}
