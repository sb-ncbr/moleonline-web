name: moleonline-web

services:
    moleonline-web:
        build:
            context: ..
            dockerfile: ./docker/Dockerfile
            args:
                # The API is served by this site's nginx under /api (nginx.site.conf)
                VITE_API_URL: ${VITE_API_URL:-/api}
        restart: unless-stopped
        container_name: moleonline-web
        ports:
            - "${MOLEONLINE_PORT:-8080}:8080"
        volumes:
            - ./nginx.devel.conf:/etc/nginx/nginx.conf:ro
            - ./nginx.site.conf:/etc/nginx/site.conf:ro
        networks:
            - moleonline
        logging:
            driver: journald
            options:
                tag: channelsdb-web

# Shared with the MOLE API's compose project, whose service "api" nginx proxies to.
# Created once: docker network create moleonline
networks:
    moleonline:
        external: true
