name: moleonline-web

services:
    moleonline-web:
        build:
            context: ..
            dockerfile: ./docker/Dockerfile
            args:
                # The API is served by this site's nginx under /api (site.conf)
                VITE_API_URL: ${VITE_API_URL:-/api}
        restart: unless-stopped
        container_name: moleonline-web
        ports:
            - "${MOLEONLINE_PORT:-8080}:8080"
        environment:
            # The entrypoint writes the templates to conf.d with the container's DNS servers
            NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./site.conf:/etc/nginx/site.conf:ro
            - ./conf.d/devel.conf:/etc/nginx/conf.d/server.conf:ro
            - ./conf.d/api.conf.template:/etc/nginx/templates/api.conf.template:ro
        networks:
            - moleonline
        logging:
            driver: journald
            options:
                tag: channelsdb-web

# Shared with the MOLE API's compose project, whose service "api" nginx proxies to.
# Created once: docker network create moleonline
networks:
    moleonline:
        external: true
