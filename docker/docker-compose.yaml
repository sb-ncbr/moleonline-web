name: moleonline-web

services:
    moleonline-web:
        build:
            context: ..
            dockerfile: ./docker/Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the MOLE API URL}
        restart: unless-stopped
        container_name: moleonline-web
        ports:
            - "${MOLEONLINE_PORT:-8080}:8080"
        volumes:
            - ./nginx.devel.conf:/etc/nginx/nginx.conf:ro
            - ./nginx.site.conf:/etc/nginx/site.conf:ro
        logging:
            driver: journald
            options:
                tag: channelsdb-web
