# Site configuration shared by conf.d/devel.conf and conf.d/production.conf,
# included inside their server blocks.

root /var/www;
index index.html;

# Keep redirects relative: nginx listens on 8080/8443 inside the container,
# which are not the ports clients connect to
absolute_redirect off;

server_tokens off;

gzip on;
gzip_vary on;
gzip_types text/plain text/xml text/css application/json application/javascript text/javascript image/svg+xml;

# Pages, legacy scripts, PDF templates and example data keep their names
# across deploys, so browsers revalidate them
add_header Cache-Control "no-cache";

location / {
    try_files $uri $uri/ =404;
}

# Vite output: file names change with their content
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /images/ {
    add_header Cache-Control "public, max-age=86400";
}

location = /favicon.ico {
    add_header Cache-Control "public, max-age=86400";
    try_files /images/favicon.ico =404;
}

# /online itself is the start page; the app redirects there after deleting a computation
location = /online {
    return 302 /;
}

location = /online/ {
    return 302 /;
}

location ^~ /online/templates/ {
    rewrite ^/online/templates/(.*)$ /html/templates/$1 last;
}

# Computation detail: /online/<computationId>[/<submitId>|/ChannelsDB]
location ^~ /online/ {
    rewrite ^ /html/detail.html last;
}

# The MOLE API, see conf.d/api.conf.template
location /api/ {
    proxy_pass http://mole_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 31m;    # uploaded structures, the API accepts files up to 30 MB
    proxy_connect_timeout 3s;    # the API is on the same host; after its restart nginx may still try the old address for up to 10 s
}
