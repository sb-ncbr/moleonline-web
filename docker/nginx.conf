# Shared by both setups; the server blocks are in conf.d (devel.conf or production.conf, see the compose files).
# nginx runs as the user nginx, which cannot write to /run (see the Dockerfile for the rest)
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include  /etc/nginx/mime.types;

    include /etc/nginx/conf.d/*.conf;
}
